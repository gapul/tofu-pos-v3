<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UTOS - Are you Tofu?</title>
<meta name="description" content="豆腐田楽の模擬店 Are you Tofu? の販売状況をリアルタイムで公示する、学務システム風のパロディサイト。">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@900&display=swap" rel="stylesheet">
<style>
/* Colours and sizes are taken from the real screens (StyleSheet.css, portal_*.css, smart_style.css). */
:root{--page:#d3def1;--body:#a3bce2;--blue:#4694d1;--shadow:#4b4e55;--link:#2a3fd5;--red:#f00;--miso:#8a4b1f;--tofu:#fbf1d9;--glow:#ffe8a9}
*{box-sizing:border-box}
html{background:var(--page)}
body{margin:0;background:var(--page);color:#333;font:12px/1.25 "ヒラギノ角ゴ Pro W3","Hiragino Kaku Gothic Pro","Hiragino Sans","メイリオ",Meiryo,"MS Pゴシック",Osaka,Arial,sans-serif;word-break:normal}
a{color:var(--link);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button,input,select,textarea{font:inherit;color:#333}
[hidden]{display:none!important}
.chunky{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN",sans-serif;font-weight:900;fill:var(--tofu);stroke:var(--miso);paint-order:stroke;stroke-linejoin:round}
/* ---------- login page (PC): the public top page ---------- */
#login{min-height:100vh}
.strip{height:24px;background:var(--blue);position:relative}
.strip .tab{position:absolute;left:0;top:0;height:24px;padding:0 34px 0 4px;background:#fff;font:bold 11px/24px Arial,sans-serif;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 100%,0 100%);white-space:nowrap}
.lg-wrap{max-width:1180px;margin:0 auto;border-left:1px solid #b9c9df;border-right:1px solid #b9c9df;min-height:calc(100vh - 24px)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:24px 60px;padding:28px 24px 36px}
.biglogo{width:min(440px,100%);aspect-ratio:440/300;position:relative}
.biglogo::before{content:"";position:absolute;inset:-10% -8%;background:radial-gradient(closest-side,var(--glow) 0%,rgba(255,232,169,.55) 45%,rgba(211,222,241,0) 100%)}
.biglogo svg{position:relative;width:100%;height:100%;overflow:visible}
.biglogo text{font-size:150px;stroke-width:16px}
.biglogo .seed{fill:#2e2018}
.side{display:flex;flex-direction:column;align-items:center;gap:30px}
.side .row{display:flex;gap:16px}
.gbtn{background:linear-gradient(#fafafa,#e4e4e4);border:1px solid #8c8c8c;border-radius:2px;padding:7px 12px;cursor:pointer;font-size:14px}
.gbtn:hover{background:linear-gradient(#fff,#ececec)}
.tri::before{content:"";display:inline-block;border:4px solid transparent;border-left:5px solid #333;margin-right:6px;vertical-align:1px}
.gbtn.big{font-size:20px;padding:12px 40px}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,420px));gap:24px 20px;padding:0 10px 30px;font-size:13px;line-height:1.7}
.pl-h{display:flex;align-items:center;gap:8px;height:25px;padding:0 10px;border-radius:12px;background:linear-gradient(#5fa3dd,var(--blue) 55%,#3f87c9);color:#fff;font-size:13px}
.pl-h i,.ph i{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#bfe0ff 45%,#4c95d4 100%);border:1px solid #fff;display:inline-grid;place-items:center;font:bold 10px/1 Georgia,serif;font-style:normal;color:#2f74b5;flex:none}
.pl-b{padding:14px 0 0}.pl-b p{margin:0 0 1.4em}.pl-b h3{font-size:15px;margin:2.2em 0 1.2em}
.red{color:var(--red)}
.links{list-style:none;margin:0;padding:22px 0 0 56px}.links li{margin:0 0 9px}
.live-inline{border:1px solid #9fb7d6;background:#fff;padding:8px 10px;margin:0 0 1.4em}.live-inline b{font-size:16px}
.lg-foot{border-top:2px solid var(--blue);padding:8px 10px 40px;color:#555;font-size:11px}
/* ---------- portal (PC) ---------- */
#portal{min-width:1000px}
.hd{display:flex;align-items:flex-start;padding:4px 18px 6px;height:76px}
.logo{display:flex;align-items:center;gap:4px;position:relative;width:270px}
.logo::after{content:"";position:absolute;left:150px;top:-4px;width:120px;height:72px;background:radial-gradient(closest-side,rgba(214,236,120,.9),rgba(214,236,120,0));z-index:0}
.logo svg{width:150px;height:62px;position:relative;z-index:1}
.logo .t{position:relative;z-index:1;font:bold 15px/1.05 "Arial Narrow","Helvetica Neue",Arial,sans-serif;transform:scaleX(.82);transform-origin:left;color:#17561f;letter-spacing:-.2px}
.sys{display:flex;gap:6px;margin-left:190px;margin-top:0}
.sys button{background:none;border:0;padding:0 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:#333;min-width:52px}
.sys svg{width:24px;height:24px}
.tabbar{background:var(--body);padding:2px 0 0 10px;display:flex;flex-wrap:wrap;min-height:74px}
.tabcell{font:inherit;font-size:11px;color:#111;width:79px;margin-right:0;padding:4px 2px 4px;text-align:center;cursor:pointer;font-size:11px;line-height:1.15;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;background:none}
.tabcell svg{width:34px;height:34px}
.tabcell.sel{background:var(--blue);border-color:#fff;color:#111}
.menubar{background:var(--blue);display:flex;flex-wrap:wrap;gap:0 4px;padding:6px 10px 5px;min-height:28px}
.menubar a{color:#111;display:inline-flex;align-items:center;gap:6px;padding:0 18px 0 6px;font-size:12px}
.menubar a.cur{text-decoration:underline}
.menubar svg,.mi svg{width:16px;height:16px;flex:none}
.pbody{display:flex;align-items:flex-start;gap:6px;padding:10px 18px 0 18px}
.lcol{width:212px;flex:none}
.portlet{background:var(--body);border-radius:7px;box-shadow:3px 3px 0 var(--shadow);border:1px solid #8aa6cf;padding:3px 4px 8px;margin:4px 6px 14px 4px}
.ph{display:flex;align-items:center;gap:8px;height:22px;padding:0 8px;border-radius:11px;background:linear-gradient(#5aa2db,var(--blue) 60%,#3d89c8);color:#111;font-size:12px;margin-bottom:4px}
.ph i{width:14px;height:14px}
.news{padding:0 4px;font-size:12px}.news p{margin:0 0 1px;text-align:center}
.news a{display:flex;gap:4px;align-items:flex-start}.news a svg{width:15px;height:15px;flex:none;margin-top:1px}
.mlist{list-style:none;margin:6px 0 0;padding:0 4px}.mlist li{margin:0 0 8px;padding-left:34px;position:relative;line-height:1.25}
.mlist svg{position:absolute;left:10px;top:0;width:16px;height:16px}
.main{flex:1;min-width:0}
.main .portlet{margin-right:0}
.fbar{display:flex;align-items:center;gap:8px;height:22px;padding:0 6px 0 8px;border-radius:11px;background:linear-gradient(#5aa2db,var(--blue) 60%,#3d89c8);color:#111;margin:0 0 5px}
.fbar svg{width:16px;height:16px}
.help{margin-left:auto;background:linear-gradient(#fff,#ddd);border:1px solid #888;font:bold 11px/14px Verdana,sans-serif;padding:0 8px 0 4px;letter-spacing:1px;cursor:pointer}
.help::before{content:"?";display:inline-block;width:11px;height:13px;background:#e6a000;color:#fff;font-size:9px;line-height:13px;text-align:center;margin-right:5px}
.ft{text-align:right;font-size:10px;color:#333;padding:16px 22px 30px}
.info-text{padding:0 4px 2px}
/* お知らせ */
.notice{font-size:13px;line-height:1.3;padding:0 4px 4px}
.notice .nh{display:flex;align-items:center;gap:6px;font-size:14px;margin:0 0 6px;padding-left:6px;border-left:8px solid #8f8fd1;line-height:20px}
.notice .hr{color:#333;margin:18px 0;overflow:hidden;white-space:nowrap;max-width:860px}
.notice b.big{font-size:15px;display:block;margin-bottom:2px}
.notice .ind{padding-left:12px;margin:6px 0}
.notice .sign{text-align:right;margin:20px 6px 8px}
.pager{display:flex;align-items:center;gap:6px;font-size:12px;padding:6px}.pager svg{width:16px;height:16px}
/* function page tables (StyleSheet.css) */
.f{padding:0 2px 6px;font-size:12px}
.gk-links{display:grid;grid-template-columns:2.4fr 1fr 1fr 1fr 1.6fr 1fr;gap:0;margin:0 0 20px}
.gk-links a{display:flex;align-items:center;gap:8px;background:#99ccff;padding:1px 4px;color:#00f}
.gk-links a::before{content:"";width:9px;height:9px;background:#fff;border:1px solid #bbb;flex:none}
.gk-links a.chk{background:#cccccc;color:#333}
.gk-wrap{display:flex;align-items:flex-start;gap:2px;margin-left:50px}
.gk-photo{width:134px;height:175px;object-fit:cover;background:#ddd;flex:none;margin-top:2px}
table.gk{border-collapse:collapse;font-size:12px;line-height:16px;margin-bottom:16px}
table.gk td,table.gk th{border:1px solid #fff;padding:4px 2px;font-weight:normal}
table.gk caption{background:#ccc;text-align:left;padding:5px 2px;border:1px solid #fff;border-bottom:0}
table.gk th{background:#99ccff;text-align:center;width:102px}
table.gk td{background:#ddd;width:104px}
table.gk.wide th,table.gk.wide td{width:102px;text-align:center;height:24px}
.gk-stack{display:flex;flex-direction:column}
/* 履修登録 */
table.rs{border-collapse:collapse}table.rs td,table.rs th{border:1px solid #fff;padding:6px;font-weight:normal}
.rs-head{width:970px}.rs-head th{background:#ffcc66;width:136px}.rs-head td{background:#ddd}
.rs-note{color:#f00;font-weight:bold;font-size:11px;margin:40px 0 50px}
.rs-tabs{display:flex;gap:1px;margin-left:0}.rs-tabs span{width:99px;text-align:center;background:#ffcc66;color:#2a3fd5;font-size:13px;padding:1px 0;clip-path:polygon(0 0,96% 0,100% 30%,100% 100%,0 100%)}
.rs-tabs span.sel{background:#ff9966;color:#000;font-weight:bold}
table.rsk{border-collapse:collapse;width:888px}table.rsk td,table.rsk th{border:1px solid #fff;font-weight:normal}
table.rsk th{background:#ff9966;font-size:12px;padding:2px}
table.rsk td.k{background:#ff9966;width:40px;text-align:center}
table.rsk td.c{background:#ddd;vertical-align:top;height:64px;padding:2px 3px;font-size:13px;line-height:1.3;width:141px}
table.rsk td.c.on{background:#ffcc99}
.rs-etc{width:660px;margin-top:16px}.rs-etc caption{background:#ffcc66;text-align:left;padding:3px;border:1px solid #fff}
.rs-etc th{background:#ff9966}.rs-etc td{background:#ddd;text-align:center}
/* 成績 */
table.ss{border-collapse:collapse}table.ss td,table.ss th{border:1px solid #fff;padding:4px 3px;font-weight:normal}
table.ss th{background:#99cc33}table.ss td{background:#ddd}
.ss-sel p{margin:14px 0 10px 4px}.ss-sel .q{background:#555;color:#fff;font-weight:bold;font-size:13px;display:inline-block;padding:0 2px}
.ss-notes{margin:16px 0;line-height:1.3;white-space:pre-line}
.ubtn{background:linear-gradient(#fff,#e6e6e6);border:1px solid #aaa;border-radius:3px;padding:1px 8px;cursor:pointer;font-size:12px}
/* 休講 */
.ky-cond{background:#e4dac6;padding:6px 8px;margin:6px 0 3px}
.ky-legend{display:flex;justify-content:space-around;width:780px;margin:0 0 12px 330px}
.ky-legend span{border:1px solid #333;font-size:10px;padding:5px 10px;text-align:center;box-shadow:1px 1px 0 #333}
.ky-nav{display:flex;justify-content:space-between;font-size:12px;margin:6px 4px 2px}
table.ky{border-collapse:collapse}table.ky td,table.ky th{border:1px solid #222;font-weight:normal}
table.ky th{background:#ffcc99;padding:2px 4px;text-align:right;width:102px;font-size:12px}
table.ky th.j{width:42px;text-align:center}
table.ky td{background:#ddd;height:101px;width:102px;vertical-align:top;padding:2px 3px;font-size:12px;line-height:1.2}
table.ky td.kaiko{background:#ffcccc}
/* シラバス */
.sy-panel{background:#fff;border:1px solid #aaa;border-radius:4px;width:660px;padding:5px 5px 30px}
.sy-tabs{background:linear-gradient(#ddd,#c8c8c8);border:1px solid #aaa;border-radius:4px;padding:4px 4px 0;display:flex;gap:2px}
.sy-tabs span{background:#fff;border:1px solid #aaa;border-bottom:0;border-radius:4px 4px 0 0;padding:6px 12px;font-size:12px;cursor:pointer}
.sy-tabs span.off{background:linear-gradient(#eee,#ddd);color:#555}
.sy-form{padding:30px 18px 0;font-size:12px}.sy-form table td{padding:3px 4px;vertical-align:top}
table.syl{border-collapse:collapse;font-size:12px}table.syl th,table.syl td{border:1px solid #fff;padding:4px}
table.syl.list th{background:#99ccff;font-weight:normal}table.syl.list td{background:#ddd}
.sy-h1{font-size:16px;font-weight:bold;border-left:6px solid #c9a0ac;padding:8px 12px;margin:12px 0 10px;border-bottom:1px dashed #c9a0ac;width:780px}
.sy-h2{font-size:16px;font-weight:bold;border-left:6px solid #c9a0ac;padding:8px 12px;margin:24px 0 16px;border-bottom:1px dashed #c9a0ac}
table.syd th{background:#9c6b7b;color:#fff;font-weight:bold;width:206px;text-align:center;line-height:1.25}
table.syd td{background:#d5ddbb;width:502px}
/* ---------- スマホ版 (smart_style.css) ---------- */
.sp-only{display:none}
body.sp .pc-only{display:none!important}
body.sp .sp-only{display:block}
body.sp #portal{min-width:0}
body.sp .strip{height:2px}body.sp .strip *{display:none}
body.sp .lg-wrap{border:0}
body.sp .gbtn{background:#ccc;border:0;border-radius:0;padding:10px;font-size:100%}
body.sp .hero{flex-direction:column;gap:0;padding:12px 5px 0}
body.sp .biglogo{width:min(300px,80%)}
body.sp .side{display:none}
.sp-title{margin:8px 5px;padding:4px 10px;border-radius:10px;background:var(--body);font:bold 15px "Courier New",Courier,monospace;text-align:center}
.sp-band{background:var(--body);height:18px;margin:12px 0 14px}.sp-panel{background:var(--body);margin:0 0 10px;padding:24px 10px;text-align:center}
.sp-panel .row{display:flex;justify-content:center;gap:14px;margin-bottom:30px}
.sp-panel .gbtn.big{font-size:20px;padding:12px 40px}
body.sp .cols{display:block;padding:0;font-size:13px;line-height:1.4;color:#000}
body.sp .cols>div{background:var(--body);padding:16px 4px 4px;margin-bottom:10px}
body.sp .cols>div:last-child{background:transparent;padding:6px}
body.sp .cols .pl-h{display:none}
body.sp .links{background:var(--body);padding:20px 20px 20px 56px;margin:0}body.sp .links li::before{content:"";display:inline-block;border:4px solid transparent;border-left:5px solid #333;margin-right:6px;vertical-align:1px}
body.sp .live-inline{border:0}
body.sp .lg-foot{border-top:0;text-align:center}
.sp-hd{display:flex;align-items:flex-start;justify-content:space-between;padding:6px 5px 0}
.sp-hd .logo{width:auto;gap:6px}.sp-hd .logo svg{width:128px;height:64px}.sp-hd .logo .t{font-size:16px}.sp-hd .logo::after{left:118px;width:120px}
.sp-user{background:#ccc;min-width:130px;display:flex;align-items:center;gap:6px;font-size:13px;margin-top:10px}
.sp-user i{width:20px;height:20px;background:#555;display:grid;place-items:center}
.sp-sys{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));width:310px;margin:16px 0 0 0}
.sp-sys button,.sp-tiles button{border:0;border-radius:0;background:var(--blue);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:11px;padding:9px 2px;line-height:1.2}
.sp-sys svg{width:18px;height:18px}
.sp-crumbs{display:flex;flex-wrap:wrap;padding:18px 6px 6px}
.sp-crumbs a{background:#555;color:#fff;padding:8px 20px;margin:0 20px 6px 5px;font-size:13px;text-decoration:none}
.sp-crumbs a::after{content:" >"}
.sp-tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px 5px;padding:14px 5px}
.sp-tiles button{aspect-ratio:91/76;font-size:10px;letter-spacing:-.3px;white-space:nowrap;overflow:hidden;gap:8px;padding:8px 1px 6px;min-width:0}
.sp-tiles svg{width:48px;height:42px}
.sp-menu{margin:4px 5px 0}
.sp-menu .mh{background:#34495e;color:#fff;font-weight:bold;text-align:center;padding:10px;font-size:13px}.sp-menu a svg{width:16px;height:16px;flex:none}
.sp-menu a{display:flex;align-items:center;gap:6px;background:#ccddee;color:#333;padding:10px 12px;border-top:1px solid #fff;font-size:13px;text-decoration:none;position:relative}
.sp-menu a::after{content:"";position:absolute;right:6px;border:5px solid transparent;border-left:7px solid #888}
.sp-menu .top{display:block;background:#34495e;color:#fff;text-align:center;font-weight:bold;padding:9px;margin-bottom:6px;font-size:13px}
.sp-menu .top::after{content:none}
.sp-panel2{margin:10px 5px}
.sp-panel2 .h{display:flex;align-items:center;gap:8px;padding:8px 10px;color:#fff;font-size:13px}.sp-panel2 .h svg,.ph svg{width:15px;height:15px;flex:none}
.sp-panel2 .b{padding:4px 10px 10px;font-size:13px}
.sp-news{background:#ddeebb}.sp-news .h{background:#336622}
.sp-fav{background:#ffbbaa}.sp-fav .h{background:#663333}
body.sp .mlist li{padding-left:40px;margin-bottom:10px;font-size:13px}
body.sp .news a{font-size:13px}
.sp-ft{text-align:right;font-size:11px;padding:20px 0 40px}
body.sp .f{overflow-x:auto;padding:4px}
.modal{position:fixed;inset:0;background:rgba(40,60,90,.45);display:grid;place-items:center;padding:16px;z-index:10}
.modal>div{background:#fff;border:2px solid var(--blue);max-width:440px;width:100%;font-size:13px;line-height:1.6}
.modal .mh{background:var(--blue);color:#fff;padding:4px 10px;font-weight:bold}
.modal .mb{padding:16px}.modal .mf{text-align:center;padding:0 0 16px}
@media (max-width:640px){.hero{padding:16px}.cols{padding:0 16px 24px}.links{padding-left:20px}}
</style>
</head>
<body>

<!-- ===== Login page (the public top page, PC and smart) ===== -->
<section id="login">
  <div class="strip"><span class="tab">UTOS（Universal Tofu Operation System）</span></div>
  <div class="lg-wrap">
    <div class="hero">
      <div class="biglogo" aria-label="UTOS">
        <svg viewBox="0 0 440 300" aria-hidden="true">
          <g class="seed"><ellipse cx="40" cy="70" rx="4" ry="8" transform="rotate(25 40 70)"/><ellipse cx="190" cy="40" rx="4" ry="8" transform="rotate(-30 190 40)"/><ellipse cx="420" cy="80" rx="4" ry="8" transform="rotate(40 420 80)"/><ellipse cx="120" cy="268" rx="4" ry="8" transform="rotate(-60 120 268)"/><ellipse cx="340" cy="270" rx="4" ry="8" transform="rotate(15 340 270)"/></g>
          <text class="chunky" transform="translate(14 205) rotate(-6)">U</text><text class="chunky" transform="translate(120 180) rotate(5)">T</text><text class="chunky" transform="translate(208 226) rotate(-7)">O</text><text class="chunky" transform="translate(320 196) rotate(6)">S</text>
        </svg>
      </div>

        <div class="row"><button class="gbtn tri" data-act="english">English</button><button class="gbtn tri" data-act="mode">スマホ版</button></div>
        <button class="gbtn big" data-act="enter">ログイン</button>
      </div>
    </div>
    <div class="sp-only">
      <div class="sp-title">UTOS（Universal Tofu Operation System)</div><div class="sp-band"></div>
      <div class="sp-panel"><div class="row"><button class="gbtn tri" data-act="english">English</button><button class="gbtn tri" data-act="mode">PC版</button></div>
        <button class="gbtn big" data-act="enter">ログイン</button></div>
    </div>
    <div class="cols">
      <div>
        <div class="pl-h"><i>i</i>Information</div>
        <div class="pl-b">
          <p data-copy="login_info"></p>
          <div class="live-inline">本日の豆腐田楽　販売数 <b data-live="sold">—</b> 本　／　残り在庫 <b data-live="stock">—</b> 本</div>
          <h3>企画紹介</h3>

          <p class="red" id="priceLine"></p>

    <div class="lg-foot" data-copy="footer"></div>
  </div>
</section>

<!-- ===== Portal ===== -->
<section id="portal" hidden>
  <!-- PC chrome -->
  <div class="pc-only">
    <div class="hd">
      <div class="logo"><svg viewBox="0 0 490 240" aria-label="UTOS"><text class="chunky" x="10" y="190" style="font-size:190px;stroke-width:18px">UTOS</text></svg><div class="t">Universal<br>Tofu Operation<br>System</div></div>
      <div class="sys" id="sys"></div>
