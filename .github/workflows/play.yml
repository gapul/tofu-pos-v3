name: Android Play testing
on:
  push:
    branches: [main]
    paths: ['android/**', 'scripts/play-*', '.github/workflows/play.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-play
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'gapul/tofu-pos-v3' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Upload only once the Play service account is configured; until then the job just builds and signs.
      HAS_PLAY_ACCOUNT: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and sign
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_SYNC_DEFAULT_JSON: ${{ secrets.ANDROID_SYNC_DEFAULT_JSON }}
          ANDROID_SYNC_DEFAULT_TEST_JSON: ${{ secrets.ANDROID_SYNC_DEFAULT_TEST_JSON }}
        run: bash scripts/play-build.sh
      - name: Upload to Play testing track
        if: env.HAS_PLAY_ACCOUNT == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_TRACK: ${{ vars.PLAY_TRACK || 'alpha' }}
        run: python3 scripts/play-upload.py android/app/build/outputs/bundle/release/app-release.aab
      - name: Attach to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(cat "$RUNNER_TEMP/version-code")
          cp android/app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/TOS-android-$code.aab"
          cp android/app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TOS-android-$code.apk"
          bash scripts/release-attach.sh android "$RUNNER_TEMP/TOS-android-$code.aab" "$RUNNER_TEMP/TOS-android-$code.apk"
      - name: Publish APK to the download page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(cat "$RUNNER_TEMP/version-code")
          bash scripts/download-publish.sh "$RUNNER_TEMP/TOS-android-$code.apk" "$code"
      - name: Remove signing materials
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks" "$RUNNER_TEMP/signing.properties" "$RUNNER_TEMP/play-key.pem" android/app/src/release/assets/sync-default*.json "$RUNNER_TEMP"/TOS-android-*
