<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
.wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;align-items:start}
.opt h3{margin:0 0 8px;font-size:15px}
.ph{border-radius:30px;overflow:hidden;border:1px solid var(--border);font-family:var(--font-sans);font-size:12px;position:relative}
/* A: charcoal dark */
.a{background:#14100D;color:#F3EDE6}
.a .hero{height:170px;background:url('/Users/gapul/Developer/github.com/gapul/tofu-pos-v3/shared/branding/dengaku-tofu-square.jpg') center/cover;position:relative}
.a .hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,16,13,.1) 30%,#14100D 98%)}
.a .top{position:absolute;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;z-index:2;font-weight:800;letter-spacing:.08em;font-size:13px}
.a .top i{font-style:normal;color:#D18C53;font-size:11px}
.a .title{position:absolute;left:14px;bottom:10px;z-index:2}
.a .title b{display:block;font-size:22px;letter-spacing:.04em}
.a .title span{color:#B9AFA6;font-size:12px}
.a .body{padding:6px 14px 14px}
.a .qty{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.a .q{font:800 54px/1 var(--font-sans);letter-spacing:-.02em}.a .q small{font-size:16px;margin-left:2px;color:#B9AFA6}
.a .rb{width:48px;height:48px;border-radius:50%;border:1.5px solid #3A2E26;display:flex;align-items:center;justify-content:center;font-size:22px;color:#F3EDE6}
.a .seg{display:flex;gap:6px;margin-bottom:10px}
.a .seg span{flex:1;text-align:center;padding:7px 0;border-radius:10px;background:#211A15;color:#B9AFA6;font-size:11px}
.a .seg span.on{background:#B66427;color:#14100D;font-weight:700}
.a .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.a .grid span{padding:9px 0;text-align:center;border-radius:10px;background:#211A15;font-weight:700}
.a .grid span.on{background:#F3EDE6;color:#14100D}
.a .change{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0;padding-top:10px;border-top:1px solid #2A211B}
.a .change b{font:800 34px var(--font-sans);color:#FFE8A9}
.a .buy{background:#B66427;color:#14100D;text-align:center;border-radius:16px;padding:14px 0;font:800 16px var(--font-sans);letter-spacing:.3em}
.a .nav{display:flex;justify-content:space-around;padding:10px 0 12px;border-top:1px solid #2A211B;color:#7D716A;font-size:10px}.a .nav .on{color:#D18C53}
/* B: paper & ink */
.b{background:#F8F7F6;color:#1A1410}
.b .top{display:flex;justify-content:space-between;padding:14px 16px 6px;font-weight:900;letter-spacing:.1em;font-size:13px}
.b .top i{font-style:normal;font-size:11px;color:#B66427}
.b .rule{height:2px;background:#1A1410;margin:0 16px}
.b .body{padding:12px 16px 14px}
.b .row{display:flex;gap:12px;align-items:center}
.b .img{width:84px;height:84px;border-radius:6px;background:url('/Users/gapul/Developer/github.com/gapul/tofu-pos-v3/shared/branding/dengaku-tofu-square.jpg') center/cover}
.b .row b{display:block;font-size:20px;letter-spacing:.06em}.b .row span{color:#635954}
.b .qty{display:flex;align-items:flex-end;justify-content:space-between;margin:14px 0 10px;border-bottom:1px solid #1A1410;padding-bottom:8px}
.b .q{font:900 60px/0.9 var(--font-sans)}.b .q small{font-size:14px}
.b .ctl{display:flex;gap:8px}.b .ctl span{width:44px;height:44px;border:1.5px solid #1A1410;display:flex;align-items:center;justify-content:center;font-size:20px}
.b .lab{font-size:10px;letter-spacing:.2em;color:#635954;margin:8px 0 4px}
.b .seg{display:flex;border:1.5px solid #1A1410}.b .seg span{flex:1;text-align:center;padding:6px 0;font-size:11px;border-right:1px solid #1A1410}.b .seg span:last-child{border:0}.b .seg span.on{background:#1A1410;color:#F8F7F6}
.b .grid{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid #1A1410}.b .grid span{padding:9px 0;text-align:center;font-weight:800;border-right:1px solid #1A1410;border-bottom:1px solid #1A1410}.b .grid span:nth-child(3n){border-right:0}.b .grid span:nth-child(n+4){border-bottom:0}.b .grid span.on{background:#B66427;color:#fff}
.b .change{display:flex;justify-content:space-between;align-items:baseline;margin:12px 0}.b .change b{font:900 36px var(--font-sans)}
.b .buy{background:#1A1410;color:#F8F7F6;text-align:center;padding:14px 0;font:900 16px var(--font-sans);letter-spacing:.4em}
.b .nav{display:flex;justify-content:space-around;padding:10px 0 12px;border-top:2px solid #1A1410;font-size:10px;color:#635954}.b .nav .on{color:#1A1410;font-weight:900}
</style></head><body>
<div class="wrap">
<div class="opt"><h3>A. 炭火（ダーク基調）</h3>
<div class="ph a">
 <div class="hero"><div class="top"><span>TOS</span><i>● 同期済み</i></div><div class="title"><b>田楽豆腐</b><span>¥500 ・ 在庫 42</span></div></div>
 <div class="body">
  <div class="qty"><div class="rb">−</div><div class="q">2<small>本</small></div><div class="rb">＋</div></div>
  <div class="seg"><span>子ども</span><span class="on">学生</span><span>大人</span><span>シニア</span></div>
  <div class="grid"><span>ちょうど</span><span>1,000</span><span>2,000</span><span class="on">5,000</span><span>10,000</span><span>手入力</span></div>
  <div class="change"><span style="color:#B9AFA6">お釣り</span><b>¥4,000</b></div>
  <div class="buy">購入</div>
 </div>
 <div class="nav"><span class="on">レジ</span><span>商品</span><span>履歴</span><span>締め</span></div>
</div></div>
<div class="opt"><h3>B. 紙と墨（白基調・線と太字）</h3>
<div class="ph b">
 <div class="top"><span>TOS</span><i>● 同期済み</i></div><div class="rule"></div>
 <div class="body">
  <div class="row"><div class="img"></div><div><b>田楽豆腐</b><span>¥500 ／ 在庫 42</span></div></div>
  <div class="qty"><div class="q">2<small>本</small></div><div class="ctl"><span>−</span><span>＋</span></div></div>
  <div class="lab">年齢</div>
  <div class="seg"><span>子ども</span><span class="on">学生</span><span>大人</span><span>シニア</span></div>
  <div class="lab">受け取った額</div>
  <div class="grid"><span>ちょうど</span><span>1,000</span><span>2,000</span><span class="on">5,000</span><span>10,000</span><span>手入力</span></div>
  <div class="change"><span>お釣り</span><b>¥4,000</b></div>
  <div class="buy">購入</div>
 </div>
 <div class="nav"><span class="on">レジ</span><span>商品</span><span>履歴</span><span>締め</span></div>
</div></div>
</div>
</body></html>
